name: Lab 2 CI/CD

on:
  push:
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2.yml'


permissions:
  contents: write


jobs:
  test:
    name: Build, test, coverage and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ catch2 gcovr cppcheck cmake

      - name: Lint
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I lab2/include \
            lab2/src


      - name: Configure Travel Agency
        run: |
          cmake \
            -S lab2/ \
            -B lab2/build \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build Travel Agency
        run: cmake --build lab2/build

      - name: Test Travel Agency
        run: ./lab2/build/travel_tests -s

      - name: Coverage Travel Agency
        working-directory: lab2/
        run: |
          gcovr --root . --filter 'src/' --fail-under-line 90

      - name: Prepare release files
        run: |
          mkdir -p release

          cp lab2/build/travel_cli \
             release/travelagency

      - name: Create archive
        run: |
          tar -czf lab2-linux.tar.gz -C release .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab2-linux
          path: lab2-linux.tar.gz


  release:
    name: Create GitHub Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab2-linux
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab2-${{ github.run_number }}
          name: Lab 2 ${{ github.run_number }}
          generate_release_notes: true
          files: release/lab2-linux.tar.gz