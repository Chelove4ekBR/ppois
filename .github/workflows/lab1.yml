name: Lab 1 CI/CD

on:
  push:
    paths:
      - 'lab1/**'
      - '.github/workflows/lab1.yml'


permissions:
  contents: write


jobs:
  test:
    name: Build, test, coverage and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ catch2 gcovr cppcheck cmake

      - name: Lint
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I lab1/Set/include \
            -I lab1/Matrix/include \
            lab1/Set/src lab1/Matrix/src


      - name: Configure Set
        run: |
          cmake \
            -S lab1/Set \
            -B lab1/Set/build \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build Set
        run: cmake --build lab1/Set/build

      - name: Test Set
        run: ./lab1/Set/build/unit_tests_set

      - name: Coverage Set
        working-directory: lab1/Set
        run: |
          gcovr --root . --filter 'src/Set.cpp' --fail-under-line 90


      - name: Configure Matrix
        run: |
          cmake \
            -S lab1/Matrix \
            -B lab1/Matrix/build \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build Matrix
        run: cmake --build lab1/Matrix/build

      - name: Test Matrix
        run: ./lab1/Matrix/build/unit_tests_matr

      - name: Coverage Matrix
        working-directory: lab1/Matrix
        run: |
          gcovr --root . --filter 'src/Matrix.cpp' --fail-under-line 90


      - name: Prepare release files
        run: |
          mkdir -p release

          cp lab1/Set/build/set \
             release/set

          cp lab1/Matrix/build/matrix \
             release/matrix

      - name: Create archive
        run: |
          tar -czf lab1-linux.tar.gz -C release .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1-linux
          path: lab1-linux.tar.gz



  release:
    name: Create GitHub Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab1-linux
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 ${{ github.run_number }}
          generate_release_notes: true
          files: release/lab1-linux.tar.gz