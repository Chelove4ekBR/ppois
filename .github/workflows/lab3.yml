name: Lab 3 CI/CD

on:
  push:
    paths:
      - 'lab3/**'
      - '.github/workflows/lab3.yml'

permissions:
  contents: write

jobs:
  test:
    name: Build, test, coverage and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ catch2 gcovr cppcheck cmake

      - name: Lint
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I lab3/include \
            lab3/src

      - name: Configure Computer System
        run: |
          cmake \
            -S lab3/ \
            -B lab3/build \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build Computer System
        run: cmake --build lab3/build

      - name: Test Computer System
        run: ./lab3/build/computer_tests -s

      - name: Coverage Computer System
        working-directory: lab3/
        run: |
          gcovr --root . --filter 'src/' --fail-under-line 90

      - name: Prepare release files
        run: |
          mkdir -p release
          cp lab3/build/computer_cli release/computer_cli

      - name: Create archive
        run: |
          tar -czf lab3-linux.tar.gz -C release .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab3-linux
          path: lab3-linux.tar.gz

  release:
    name: Create GitHub Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab3-linux
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab3-${{ github.run_number }}
          name: Lab 3 ${{ github.run_number }}
          generate_release_notes: true
          files: release/lab3-linux.tar.gz
